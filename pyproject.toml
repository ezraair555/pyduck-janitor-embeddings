[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyduck-janitor-embeddings"
version = "0.1.0"
description = "Bundled embedding models for pyduck-janitor"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "EzraAir555", email = "ezraair555@gmail.com"}
]
keywords = ["pyduck-janitor", "embedding", "sentence-transformers", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyduck-janitor>=0.2.0",
]

[project.optional-dependencies]
build = [
    "huggingface_hub>=0.20",
]

[project.urls]
Homepage = "https://github.com/ezraair555/pyduck-janitor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyduck_janitor_embeddings" = ["data/embeddings/**/*.json", "data/embeddings/**/*.txt", "data/embeddings/**/*.safetensors", "data/embeddings/**/*.bin"]
