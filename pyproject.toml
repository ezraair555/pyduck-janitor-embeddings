[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyduck-janitor-embeddings"
version = "0.1.0"
description = "Bundled embedding models for pyduck-janitor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "EzraAir555", email = "ezraair555@gmail.com"}
]
keywords = ["pyduck-janitor", "embedding", "sentence-transformers", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyduck-janitor>=0.2.0",
]

[project.optional-dependencies]
build = [
    "huggingface_hub>=0.20",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/ezraair555/pyduck-janitor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyduck_janitor_embeddings" = [
    "data/embeddings/**/*.json",
    "data/embeddings/**/*.txt",
    "data/embeddings/**/*.safetensors",
    "data/embeddings/**/*.bin",
    "data/embeddings/**/NOTICE",
    "data/embeddings/**/LICENSE",
    "data/embeddings/**/LICENSE.*",
    "data/embeddings/**/NOTICE.*",
]
