name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Validate bundled weights (license + structure)
        run: |
          python -c "
          from pyduck_janitor_embeddings import list_bundled
          models = list_bundled()
          assert models, 'No bundled models. Did you run scripts/fetch_models.py before building?'
          for m in models:
              print(' bundled:', m)
          "

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Populate bundled weights
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          python scripts/fetch_models.py
      - name: Install build tooling
        run: |
          pip install build
      - name: Build sdist + wheel
        run: python -m build --sdist --wheel
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
