name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pyduck-janitor from source
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/ezraair555/pyduck-janitor.git@main
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package
        run: |
          pip install -e ".[build,dev]"
      - name: Run tests
        run: |
          python -m pytest -q
      - name: Populate bundled weights (advisory)
        run: |
          python scripts/fetch_models.py
      - name: Validate bundled weights (license + structure)
        run: |
          python -c "
          from pyduck_janitor_embeddings import list_bundled
          models = list_bundled()
          assert models, 'No bundled models. Did fetch_models.py run?'
          for m in models:
              print(' bundled:', m)
          # Verify each model has a NOTICE file with attribution.
          import os
          for m in models:
              slug = m.replace('/', '__').replace('@', '_at_')
              base = (
                  'src/pyduck_janitor_embeddings/data/embeddings/' + slug
              )
              notice = os.path.join(base, 'NOTICE')
              assert os.path.exists(notice), (
                  f'Missing NOTICE for {m}; weights lack attribution.'
              )
              with open(notice) as f:
                  contents = f.read()
              assert 'huggingface.co' in contents, (
                  f'NOTICE for {m} missing upstream URL'
              )
          print(' license trail OK')
          "

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [quality]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Populate bundled weights
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          python scripts/fetch_models.py
      - name: Install build tooling
        run: |
          pip install build
      - name: Build sdist + wheel
        run: python -m build --sdist --wheel
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
